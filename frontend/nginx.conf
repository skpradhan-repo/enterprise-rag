server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads (up to 50 MB)
    client_max_body_size 50M;

    # Use Podman's DNS resolver so nginx re-resolves 'app' on every request
    # instead of caching the IP at startup. This survives container restarts.
    # 10.89.2.1 is Podman's network gateway / DNS server.
    resolver 10.89.2.1 valid=5s ipv6=off;
    set $backend http://app:8090;

    # Proxy API calls to the Spring Boot backend container
    location /api/ {
        proxy_pass             $backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     180s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     180s;
    }

    # SPA routing — all other routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

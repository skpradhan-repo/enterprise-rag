spring:
  application:
    name: enterprise-rag

  # ── Datasource ───────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ragdb}
    username: ${DB_USERNAME:raguser}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Security / Keycloak ──────────────────────────────────────────
  # issuer-uri must match the "iss" claim in the JWT (the public-facing URL the
  # browser uses). jwk-set-uri lets Spring fetch keys from the internal container
  # hostname regardless of what issuer string is in the token.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/enterprise-rag}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/enterprise-rag/protocol/openid-connect/certs}

  # ── Spring AI: Ollama ────────────────────────────────────────────
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${LLM_MODEL:llama3.2}
        options:
          temperature: 0.3
          num-predict: 2048
          top-p: 0.9
      embedding:
        model: ${EMBEDDING_MODEL:nomic-embed-text}

    # ── PGVector ────────────────────────────────────────────────────
    vectorstore:
      pgvector:
        schema-name: public
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: false      # schema managed by Flyway

    # ── MCP Client ──────────────────────────────────────────────────
    mcp:
      client:
        enabled: true
        name: enterprise-rag-client
        version: 1.0.0
        request-timeout: 30s
        toolcallback:
          enabled: true
      server:
        name: enterprise-rag-mcp-server
        version: 1.0.0

  # ── File uploads ─────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_FILE_SIZE:50MB}

# ── Actuator ───────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
    tracing:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# ── OpenAPI ────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: http://localhost:8090/swagger-ui/oauth2-redirect.html

# ── Server ─────────────────────────────────────────────────────────
# address defaults to 0.0.0.0 so nginx (in another container) can reach it via
# the Docker network. External access is still gated by the compose port binding
# 127.0.0.1:8090:8090 — traffic from outside the host cannot reach this port.
server:
  port: ${SERVER_PORT:8090}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ── Logging ────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.enterprise.rag: DEBUG
    org.springframework.ai: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{40} - %msg%n"

# ── Application-specific properties ────────────────────────────────
app:
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.65}
    chunk-size: ${CHUNK_SIZE:512}
    chunk-overlap: ${CHUNK_OVERLAP:64}
    max-context-chars: 8000
    max-conversation-messages: 10
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000
